<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautifulCode</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #0a0a0a;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        h1 { 
            color: #fff; 
            margin-bottom: 25px; 
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .workspace {
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            gap: 25px;
            align-items: start;
        }
        
        .left-panel, .controls {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }
        
        .controls {
            max-height: 85vh;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .controls::-webkit-scrollbar {
            width: 8px;
        }
        
        .controls::-webkit-scrollbar-track {
            background: #0d0d0d;
            border-radius: 10px;
        }
        
        .controls::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        
        .controls::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
        
        label {
            color: #888;
            font-size: 12px;
            display: block;
            margin-bottom: 8px;
            margin-top: 12px;
        }
        
        label:first-of-type {
            margin-top: 0;
        }
        
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            background: #0d0d0d;
            color: #fff;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            font-family: 'Monaco', monospace;
            font-size: 12px;
            resize: vertical;
        }
        
        select, input, button {
            width: 100%;
            padding: 10px;
            font-size: 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        
        select, input[type="number"] {
            background: #0d0d0d;
            color: #fff;
            border: 1px solid #2a2a2a;
            margin-bottom: 8px;
        }
        
        input[type="color"] {
            height: 40px;
            cursor: pointer;
            border: 1px solid #2a2a2a;
            background: #0d0d0d;
            padding: 3px;
            margin-bottom: 8px;
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            height: 6px;
            background: #2a2a2a;
            outline: none;
            padding: 0;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border-radius: 50%;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }
        
        .range-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .range-value {
            color: #667eea;
            font-size: 12px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-btn {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            color: #888;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            transition: all 0.2s;
            display: block;
        }
        
        .file-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-weight: 600;
            margin-top: 10px;
        }
        
        button:hover { opacity: 0.9; }
        
        .gradient-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .gradient-option {
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
        }
        
        .gradient-option:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        .gradient-option.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        #preview {
            padding: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            transition: all 0.3s;
            background-size: cover;
            background-position: center;
        }
        
        .window {
            background: linear-gradient(to bottom, #21222c 0%, #21222c 45px, #1a1b26 45px);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 
                0 40px 80px rgba(0,0,0,0.5),
                0 15px 30px rgba(0,0,0,0.3);
            display: inline-block;
            max-width: 100%;
            transition: all 0.3s;
        }
        
        .header {
            padding: 13px 18px;
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .dots {
            position: absolute;
            left: 18px;
            display: flex;
            gap: 7px;
        }
        
        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        
        .title {
            color: #6e7681;
            font-size: 13px;
            font-weight: 500;
        }
        
        .content {
            padding: 25px 30px;
            background: #1a1b26;
        }
        
        pre {
            margin: 0;
            background: transparent !important;
        }
        
        code {
            font-family: 'Monaco', 'Consolas', monospace !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
        }
        
        .hljs {
            background: transparent !important;
        }
        
        @media (max-width: 1100px) {
            .workspace {
                grid-template-columns: 1fr;
            }
            
            .left-panel {
                order: 1;
            }
            
            #preview {
                order: 2;
            }
            
            .controls {
                order: 3;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸Beautiful Code </h1>
        
        <div class="workspace">
            <div class="left-panel">
                <label>КОД</label>
                <textarea id="codeInput" placeholder="Вставь код...">n = input().split()
count = 0

for i in range(len(n) - 1):
        for j in range(1, len(n)):
                if n[0] == n[j]:
                        count += 1
        del n[0]
print(count)</textarea>
                
                <label>ЯЗЫК</label>
                <select id="langSelect" onchange="generate()">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="typescript">TypeScript</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="c">C</option>
                    <option value="go">Go</option>
                    <option value="rust">Rust</option>
                    <option value="php">PHP</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                </select>
                
                <button onclick="generate()">Сгенерировать</button>
                <button onclick="download()">Скачать</button>
            </div>
            
            <div id="preview" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>
            
            <div class="controls">
                <label>ФОН</label>
                <div class="gradient-grid">
                    <div class="gradient-option active" data-gradient="linear-gradient(135deg, #667eea 0%, #764ba2 100%)" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>
                    <div class="gradient-option" data-gradient="linear-gradient(135deg, #f093fb 0%, #f5576c 100%)" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);"></div>
                    <div class="gradient-option" data-gradient="linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);"></div>
                    <div class="gradient-option" data-gradient="linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);"></div>
                    <div class="gradient-option" data-gradient="linear-gradient(135deg, #fa709a 0%, #fee140 100%)" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);"></div>
                    <div class="gradient-option" data-gradient="linear-gradient(135deg, #30cfd0 0%, #330867 100%)" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);"></div>
                    <div class="gradient-option" data-gradient="linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);"></div>
                    <div class="gradient-option" data-gradient="linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);"></div>
                </div>
                
                <label>СВОЙ ЦВЕТ 1</label>
                <input type="color" id="color1" value="#667eea">
                
                <label>СВОЙ ЦВЕТ 2</label>
                <input type="color" id="color2" value="#764ba2">
                
                <label>ЗАГРУЗИТЬ ФОН</label>
                <label for="bgUpload" class="file-btn">📁 Выбрать изображение</label>
                <input type="file" id="bgUpload" accept="image/*">
                
                <label class="range-info">
                    <span>PADDING</span>
                    <span class="range-value" id="paddingVal">60px</span>
                </label>
                <input type="range" id="padding" min="20" max="150" value="60" oninput="updatePadding(this.value)">
                
                <label class="range-info">
                    <span>SCALE</span>
                    <span class="range-value" id="scaleVal">1.0x</span>
                </label>
                <input type="range" id="scale" min="0.5" max="2" step="0.1" value="1" oninput="updateScale(this.value)">
                
                <label class="range-info">
                    <span>ROUND</span>
                    <span class="range-value" id="roundVal">12px</span>
                </label>
                <input type="range" id="round" min="0" max="30" value="12" oninput="updateRound(this.value)">
            </div>
        </div>
    </div>

    <script>
        let currentGradient = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        let currentBgImage = null;
        
        window.onload = () => generate();
        
        document.querySelectorAll('.gradient-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.gradient-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                currentGradient = this.dataset.gradient;
                currentBgImage = null;
                updatePreviewBg();
            });
        });
        
        document.getElementById('color1').addEventListener('input', updateCustomGradient);
        document.getElementById('color2').addEventListener('input', updateCustomGradient);
        
        function updateCustomGradient() {
            const c1 = document.getElementById('color1').value;
            const c2 = document.getElementById('color2').value;
            currentGradient = `linear-gradient(135deg, ${c1} 0%, ${c2} 100%)`;
            currentBgImage = null;
            document.querySelectorAll('.gradient-option').forEach(o => o.classList.remove('active'));
            updatePreviewBg();
        }
        
        document.getElementById('bgUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentBgImage = event.target.result;
                    document.querySelectorAll('.gradient-option').forEach(o => o.classList.remove('active'));
                    updatePreviewBg();
                };
                reader.readAsDataURL(file);
            }
        });
        
        function updatePreviewBg() {
            const preview = document.getElementById('preview');
            if (currentBgImage) {
                preview.style.background = `url(${currentBgImage})`;
                preview.style.backgroundSize = 'cover';
                preview.style.backgroundPosition = 'center';
            } else {
                preview.style.background = currentGradient;
            }
        }
        
        function updatePadding(val) {
            document.getElementById('paddingVal').textContent = val + 'px';
            document.getElementById('preview').style.padding = val + 'px';
        }
        
        function updateScale(val) {
            document.getElementById('scaleVal').textContent = val + 'x';
            const window = document.querySelector('.window');
            if (window) window.style.transform = `scale(${val})`;
        }
        
        function updateRound(val) {
            document.getElementById('roundVal').textContent = val + 'px';
            const window = document.querySelector('.window');
            if (window) window.style.borderRadius = val + 'px';
        }
        
        function generate() {
            const code = document.getElementById('codeInput').value;
            const lang = document.getElementById('langSelect').value;
            
            if (!code.trim()) {
                alert('Вставь код!');
                return;
            }
            
            const langNames = {
                'python': 'Python', 
                'javascript': 'JavaScript', 
                'typescript': 'TypeScript', 
                'java': 'Java',
                'cpp': 'C++', 
                'c': 'C', 
                'go': 'Go', 
                'rust': 'Rust',
                'php': 'PHP', 
                'html': 'HTML', 
                'css': 'CSS'
            };
            
            const preview = document.getElementById('preview');
            preview.innerHTML = `
                <div class="window" id="screenshot">
                    <div class="header">
                        <div class="dots">
                            <div class="dot" style="background: #ff5f56;"></div>
                            <div class="dot" style="background: #ffbd2e;"></div>
                            <div class="dot" style="background: #27c93f;"></div>
                        </div>
                        <div class="title">${langNames[lang]}</div>
                    </div>
                    <div class="content">
                        <pre><code class="language-${lang}">${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
                    </div>
                </div>
            `;
            
            hljs.highlightAll();
            updateScale(document.getElementById('scale').value);
            updateRound(document.getElementById('round').value);
        }
        
        function download() {
            const element = document.getElementById('preview');
            
            html2canvas(element, {
                scale: 2.5,
                backgroundColor: null,
                logging: false,
                useCORS: true,
                allowTaint: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'beautiful-code-picture.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
